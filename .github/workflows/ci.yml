# Public/fork-PR CI for spec-ci-plugin.
#
# RUNNER: GitHub-hosted `ubuntu-24.04` (fixed image, not `ubuntu-latest`).
# This repo is public and the org runner group has
# `allows_public_repositories: false`, so no self-hosted runner can serve it;
# public UnityInFlow repos run on GitHub-hosted runners. This job is
# secretless (`contents: read`), so fork PRs are safe here.
#
# `release.yml` is GitHub-hosted too, and for a stricter reason: under
# `allows_public_repositories: false` a self-hosted job cannot be scheduled on
# this repo at all, so the v1 tag-mover it contains had silently never run. It
# is safe there because it uses no org secret — only the built-in GITHUB_TOKEN —
# and `release: published` cannot be fired by a fork.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # D-02 exception (see top-of-file comment): GitHub-hosted, secretless.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint
        name: Type check

      - run: npm run format
        name: Format check

      - run: npm test
        name: Run tests

      - run: npm run build
        name: Build action

      - name: Verify committed dist/ is not stale
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit dist/."
            exit 1
          fi
