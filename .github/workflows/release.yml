# Release-time automation for spec-ci-plugin.
#
# Fires ONCE per published release (the human "Publish release" Marketplace
# click). Its only job is to keep the moving major-version git tag (e.g. `v1`)
# pointing at the just-published immutable `vX.Y.Z` tag, so consumers can pin
# `uses: UnityInFlow/spec-ci-plugin@v1`.
#
# CRITICAL: `v1` is a PLAIN MOVING GIT TAG ONLY. This workflow must NEVER create
# a GitHub Release object for `v1` — that would be incompatible with immutable
# releases. Only the `vX.Y.Z` Release (created by the human via the Releases UI)
# is a real Release object.
#
# RUNNER: GitHub-hosted, and that is deliberate.
#
# This job was `runs-on: [arc-runner-unityinflow]`, which could never run. Two
# independent reasons, either one fatal:
#
#   1. This repo is PUBLIC and the org runner group enforces
#      `allows_public_repositories: false`. No self-hosted job can be scheduled
#      here AT ALL, whatever the trigger. The old comment reasoned only about
#      fork exposure, which is a different constraint and does not save it.
#   2. `arc-runner-unityinflow` matches zero registered runners (OPS-01 D-03).
#
# The consequence was not a loud failure. `v1` simply stopped moving after it
# was set by hand at v1.0.0, so every consumer pinning `@v1` kept executing the
# dist from that commit -- including, until this is fixed and v1 is moved, a
# download path with no checksum verification and a fixed unversioned
# `/tmp/injection-scanner` cache that `existsSync` returns without re-checking.
# On a persistent runner anything able to write /tmp gets executed.
#
# Same exception injection-scanner was granted in August 2026 (issue #45), for
# the same reason and with the same safety argument: this workflow uses NO org
# secret -- only the built-in GITHUB_TOKEN -- and `release: published` cannot be
# fired by a fork, which is what makes `contents: write` acceptable here.

name: Release

on:
  release:
    types: [published]

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # SHA-pinned: this job holds `contents: write` and force-pushes a tag
      # consumers execute. A floating tag here is the one place a compromised
      # action upstream would matter most.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move major-version tag (vN -> vX.Y.Z)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/}"
          MAJOR="${TAG%%.*}"
          echo "Published tag: $TAG"
          echo "Moving major tag: $MAJOR -> $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR -> $TAG"
          git push origin "$MAJOR" --force
