name: "UnityInFlow Spec Compliance"
description: "Enforce spec-linter, injection-scanner, scope, and criteria checks on every PR"
author: "UnityInFlow"

inputs:
  github-token:
    description: "GitHub token for posting PR comments and reading PR files"
    required: false
    default: "${{ github.token }}"
  spec-file:
    description: "Path to spec file (CLAUDE.md, REQUIREMENTS.md, etc.)"
    required: false
    default: "CLAUDE.md"
  fail-on:
    description: "When to fail: errors | warnings | never"
    required: false
    default: "errors"
  post-comment:
    description: "Post compliance report as PR comment"
    required: false
    default: "true"
  injection-scanner-version:
    description: "injection-scanner release version to download (v0.0.2 or later; the binary is SHA256-verified against the release manifest before it runs)"
    required: false
    default: "v0.0.3"
  allow-suppressions:
    description: "Honour injection-scanner:ignore directives found inside the scanned file. Off by default: this Action scans pull requests, so the file's author is the party the scan is meant to catch."
    required: false
    default: "false"

outputs:
  status:
    description: "Overall compliance status: pass | warn | fail"
  report:
    description: "Full compliance report as a JSON string"

runs:
  using: "node20"
  main: "dist/index.js"

branding:
  icon: "shield"
  color: "blue"
